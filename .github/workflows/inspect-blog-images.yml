name: Inspect new blog images

on:
  push:
    branches: ["main"]
    paths:
      - "tools/inspect-blog-images.py"
      - ".github/workflows/inspect-blog-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Build inspection thumbnails
        run: python tools/inspect-blog-images.py
      - name: Commit inspection thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/blog/.inspection-thumbnails.json
          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
          else
            git commit -m "Create temporary blog image inspection thumbnails"
            git push
          fi
